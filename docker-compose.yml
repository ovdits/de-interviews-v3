services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/synthetic.sql:/docker-entrypoint-initdb.d/02-synthetic.sql
      - ./sql/raw_core_mart.sql:/docker-entrypoint-initdb.d/03-raw_core_mart.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-deals_bigdata}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # Команда по умолчанию — полный ETL-пайплайн
    command: python -m etl.run --layers raw,core,mart,dimensions
    # Для запуска ML-скоринга:
    # docker compose run --rm app python -m ml.run

volumes:
  pgdata:
