[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smart-logistics-data"
version = "1.0.0"
description = "Платформа аналитики и прогнозирования тарифов грузоперевозок"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "catboost>=1.2",
    "joblib>=1.3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
airflow = [
    "apache-airflow>=2.8",
]

[project.scripts]
etl = "etl.run:main"
ml = "ml.run:main"

[tool.setuptools.packages.find]
include = ["etl*", "ml*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["etl", "ml"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
